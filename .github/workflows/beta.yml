name: Build Beta Release

on:
  workflow_dispatch:
    inputs:
      beta_version:
        description: 'Beta version (e.g., v1.0.0-beta.1, v1.0.0-rc.1)'
        required: true
        type: string

jobs:
  build-windows:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Check Svelte components
        run: pnpm check

      - name: Run frontend tests
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Cache cargo-xwin
        id: cache-cargo-xwin
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-xwin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-xwin-${{ runner.os }}-locked

      - name: Install cargo-xwin
        if: steps.cache-cargo-xwin.outputs.cache-hit != 'true'
        run: cargo install cargo-xwin --locked

      - name: Cache MSVC CRT and Windows SDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-xwin
          key: xwin-sdk-${{ runner.os }}-${{ matrix.target }}

      - name: Build Windows binary
        run: cd src-tauri && cargo xwin build --release --features custom-protocol --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-sanitizer-beta-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/pdf-sanitizer.exe

      # Pre-release notes are the changelog's [Unreleased] section.
      - name: Write release notes
        env:
          BETA_VERSION: ${{ github.event.inputs.beta_version }}
        run: |
          {
            echo "> [!WARNING]"
            echo "> **Pre-release for testing.** Features may change before the stable release. Please [report issues](https://github.com/${GITHUB_REPOSITORY}/issues)."
            echo
            node scripts/release.mjs notes "$BETA_VERSION"
          } > release-notes.md

      - name: Create Beta Release
        uses: softprops/action-gh-release@v2
        with:
          name: PDF Sanitizer ${{ github.event.inputs.beta_version }}
          body_path: release-notes.md
          generate_release_notes: true
          files: src-tauri/target/${{ matrix.target }}/release/pdf-sanitizer.exe
          tag_name: ${{ github.event.inputs.beta_version }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
