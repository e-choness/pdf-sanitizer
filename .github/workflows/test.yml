name: Test & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Check Svelte components
        run: pnpm check

      - name: Run frontend tests
        run: pnpm test

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Check Rust formatting
        run: cd src-tauri && cargo fmt --check

      - name: Lint Rust
        run: cd src-tauri && cargo clippy --workspace -- -D warnings

      - name: Run core library tests
        run: cd src-tauri && cargo test -p pdfsan-core

      - name: Check Rust workspace
        run: cd src-tauri && cargo check --workspace
