name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64

    steps:
      - uses: actions/checkout@v4

      # Fail fast if the tag was pushed without running `scripts/release.mjs prepare`.
      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/release.mjs check "$GITHUB_REF_NAME"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Check Svelte components
        run: pnpm check

      - name: Run frontend tests
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Cache cargo-xwin
        id: cache-cargo-xwin
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-xwin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-xwin-${{ runner.os }}-locked

      - name: Install cargo-xwin
        if: steps.cache-cargo-xwin.outputs.cache-hit != 'true'
        run: cargo install cargo-xwin --locked

      - name: Cache MSVC CRT and Windows SDK
        uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-xwin
          key: xwin-sdk-${{ runner.os }}-${{ matrix.target }}

      # tauri-winres compiles the Windows resources (icon, version info) with
      # llvm-rc when cross-compiling. The runner ships LLVM under
      # /usr/lib/llvm-*/bin without putting llvm-rc on PATH.
      - name: Put llvm-rc on PATH
        run: |
          if ! command -v llvm-rc >/dev/null; then
            dir=$(printf '%s\n' /usr/lib/llvm-*/bin | sort -V | tail -n1)
            if [ -n "$dir" ] && [ -x "$dir/llvm-rc" ]; then
              echo "$dir" >> "$GITHUB_PATH"
            else
              sudo apt-get update && sudo apt-get install -y llvm
            fi
          fi

      - name: Build Windows binary
        run: cd src-tauri && cargo xwin build --release --features custom-protocol --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-sanitizer-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/pdf-sanitizer.exe

      - name: Extract release notes from changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/release.mjs notes "$GITHUB_REF_NAME" > release-notes.md

      # Body = the version's changelog section, followed by GitHub's generated
      # list of merged PRs and a "Full Changelog" compare link.
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: PDF Sanitizer ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          files: src-tauri/target/${{ matrix.target }}/release/pdf-sanitizer.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
