[workspace]
members = [".", "crates/pdfsan-core"]

[package]
name = "pdf-sanitizer"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pdfsan-core = { path = "crates/pdfsan-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
dirs = "5.0"
log = "0.4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
